<div class="row justify-content-center align-items-center" style="min-height: 80vh">
  <div class="col-md-4">
    <div class="card shadow-lg">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <h3 class="font-weight-bold">🔐 Sécurité PaieZone</h3>
          <p class="text-muted">Veuillez saisir le code de vérification à 6 chiffres envoyé à votre email.</p>
        </div>

        <div class="alert alert-danger text-center" *ngIf="error"><strong>Code incorrect !</strong> Veuillez réessayer.</div>

        <form (ngSubmit)="confirmCode()" #loginForm="ngForm">
          <div class="mb-4">
            <input
              type="text"
              class="form-control form-control-lg text-center"
              [(ngModel)]="otpCode"
              name="otpCode"
              placeholder="000000"
              maxlength="6"
              required
              style="letter-spacing: 10px; font-size: 2rem; border: 2px solid #0d6efd"
            />
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="loginForm.form.invalid || isLoading">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
            Vérifier et accéder au RH
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
