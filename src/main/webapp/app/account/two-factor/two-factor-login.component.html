<div class="row justify-content-center">
  <div class="col-md-4">
    <div class="card shadow-lg mt-5">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <h3 class="font-weight-bold">Sécurité PaieZone</h3>
          <p class="text-muted">Veuillez saisir le code de vérification à 6 chiffres.</p>
        </div>

        <div class="alert alert-danger" *ngIf="error"><strong>Code incorrect !</strong> Veuillez réessayer.</div>

        <form (ngSubmit)="confirmCode()" #loginForm="ngForm">
          <div class="mb-4">
            <input
              type="text"
              class="form-control form-control-lg text-center"
              [(ngModel)]="otpCode"
              name="otpCode"
              placeholder="0 0 0 0 0 0"
              maxlength="6"
              required
              style="letter-spacing: 10px; font-size: 2rem"
            />
          </div>

          <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="loginForm.form.invalid">Vérifier et accéder au RH</button>
        </form>
      </div>
    </div>
  </div>
</div>
