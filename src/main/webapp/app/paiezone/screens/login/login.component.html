<div class="auth-card">
  <!-- Eyebrow -->
  <div class="eyebrow"><span class="ey-num">01</span> Connexion sécurisée</div>

  <!-- Title -->
  <h1>Bon retour,<br /><em>bienvenue.</em></h1>
  <p class="lead">Connectez-vous pour accéder à votre <strong>tableau de bord PaieZone RH</strong>.</p>

  <!-- Error banner -->
  @if (error()) {
    <div class="err-alert">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="8" cy="8" r="6.5" />
        <path d="M8 5v3.5M8 11h.01" />
      </svg>
      {{ error() }}
    </div>
  }

  <!-- Form -->
  <form class="form" (submit)="$event.preventDefault(); submit()">
    <!-- Identifiant -->
    <div class="field">
      <label for="li-login">Identifiant <span class="req">*</span></label>
      <div class="input-wrap" [class.is-err]="emailError()">
        <span class="ico">
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="3.5" width="12" height="9" rx="1.4" />
            <path d="m2 5 6 4 6-4" />
          </svg>
        </span>
        <input
          id="li-login"
          type="text"
          placeholder="votre.identifiant"
          autocomplete="username"
          autofocus
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="username"
        />
      </div>
    </div>

    <!-- Mot de passe -->
    <div class="field">
      <label for="li-pwd">Mot de passe <span class="req">*</span></label>
      <div class="input-wrap" [class.is-err]="pwdError()">
        <span class="ico">
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3.5" y="7.5" width="9" height="6.5" rx="1.2" />
            <path d="M5.5 7.5V5.5a2.5 2.5 0 0 1 5 0v2" />
          </svg>
        </span>
        <input
          id="li-pwd"
          [type]="showPwd() ? 'text' : 'password'"
          placeholder="••••••••••"
          autocomplete="current-password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
        />
        <button type="button" class="reveal" (click)="showPwd.set(!showPwd())" [attr.aria-label]="showPwd() ? 'Masquer' : 'Afficher'">
          @if (showPwd()) {
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path
                d="M2 2l12 12M6.7 6.8A2 2 0 0 0 10 10M4.5 4.6C3 5.6 1.9 7 1.9 8s2.6 4.5 6.1 4.5c1.2 0 2.3-.3 3.3-.9M12.5 11.4c.9-.8 1.6-1.9 1.6-3.4 0-1-2.5-4.5-6.1-4.5-.7 0-1.4.1-2.1.4"
              />
            </svg>
          } @else {
            <svg
              width="16"
              height="16"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z" />
              <circle cx="8" cy="8" r="2" />
            </svg>
          }
        </button>
      </div>
    </div>

    <!-- Remember + forgot -->
    <div class="row-btw">
      <label class="chk">
        <input type="checkbox" [ngModel]="remember()" (ngModelChange)="remember.set($event)" name="remember" />
        <span class="chk-box">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M1.5 5l2.5 2.5 4.5-4.5" />
          </svg>
        </span>
        Rester connecté
      </label>
      <a class="link-pale" routerLink="/paiezone/forgot-password">Mot de passe oublié ?</a>
    </div>

    <!-- Submit -->
    <button type="submit" class="btn-submit" [disabled]="busy()">
      @if (busy()) {
        <span class="spin"></span>
        Connexion en cours…
      } @else {
        Se connecter
        <svg
          class="arr"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 8h10M9 4l4 4-4 4" />
        </svg>
      }
    </button>
  </form>

  <!-- Footer link -->
  <div class="card-foot">
    Pas encore de compte ?
    <a routerLink="/paiezone/register">Créer un compte</a>
  </div>
</div>
