<div class="modal-header border-0">
  <h5 class="modal-title text-danger fw-bold">
    <i class="fas fa-exclamation-triangle me-2"></i>Confirmer la suppression
  </h5>
  <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
</div>

<div class="modal-body">
  <p>
    Êtes-vous sûr de vouloir supprimer la période
    <strong>
      {{ getMonthLabel(payrollPeriod.month!) }} {{ payrollPeriod.year }}
    </strong> ?
  </p>
  <div class="alert alert-warning mb-0">
    <i class="fas fa-info-circle me-2"></i>
    Cette action est irréversible. Tous les bulletins associés seront supprimés.
  </div>
</div>

<div class="modal-footer border-0">
  <button type="button" class="btn btn-outline-secondary" (click)="modal.dismiss()">
    <i class="fas fa-times me-1"></i>Annuler
  </button>
  <button type="button" class="btn btn-danger"
          (click)="onConfirm()" [disabled]="isDeleting">
    <span *ngIf="isDeleting"
          class="spinner-border spinner-border-sm me-1"></span>
    <i *ngIf="!isDeleting" class="fas fa-trash me-1"></i>
    Supprimer
  </button>
</div>
