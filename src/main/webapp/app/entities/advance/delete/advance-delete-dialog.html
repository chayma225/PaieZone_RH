<form (ngSubmit)="confirmDelete(advance!.id)">
  <div class="modal-header"><h4>Supprimer l'avance</h4><button type="button" class="btn-close" (click)="cancel()"></button></div>
  <div class="modal-body">
    Supprimer l'avance de <strong>{{ advance?.amount | number:'1.3-3' }} DT</strong> pour l'employé #{{ advance?.employeeId }} ?
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
    <button type="submit" class="btn btn-danger">Supprimer</button>
  </div>
</form>
