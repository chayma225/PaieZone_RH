<!-- src/main/webapp/app/entities/advance/update/advance-update.component.html -->
<div class="row justify-content-center">
  <div class="col-md-6">
    <form novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2>{{ advance?.id ? 'Modifier' : 'Nouvelle' }} Avance sur salaire</h2>
      <pz-alert-error></pz-alert-error>
      <div class="mb-3">
        <label class="form-label">Employé ID <span class="text-danger">*</span></label>
        <input type="number" class="form-control" formControlName="employeeId"/>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Date de demande <span class="text-danger">*</span></label>
          <input type="date" class="form-control" formControlName="requestDate"/>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Montant (DT) <span class="text-danger">*</span></label>
          <input type="number" step="0.001" class="form-control text-end" formControlName="amount"/>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Motif</label>
        <input type="text" class="form-control" formControlName="reason"/>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Mois déduction <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="deductionMonth">
            <option *ngFor="let m of months" [value]="m">{{ monthLabels[m] }}</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Année déduction <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="deductionYear">
            <option *ngFor="let y of years" [value]="y">{{ y }}</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Statut <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="status">
            <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Approuvé par</label>
        <input type="text" class="form-control" formControlName="approvedBy" placeholder="Login du manager"/>
      </div>

      <div class="alert alert-info small">
        ⚠️ Seules les avances avec statut <strong>APPROVED</strong> seront déduites lors du calcul de paie.
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-secondary" (click)="previousState()"><fa-icon icon="ban"></fa-icon> Annuler</button>
        <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid || isSaving"><fa-icon icon="save"></fa-icon> Enregistrer</button>
      </div>
    </form>
  </div>
</div>
