<div class="rp-update-page">

  <div class="rp-update-header">
    <button type="button" class="btn-back" (click)="previousState()">← Retour</button>
    <div>
      <h1 class="rp-update-header__title">
        {{ regulatoryParam?.id ? '✏️ Modifier le paramètre' : '＋ Nouveau paramètre' }}
      </h1>
      <p class="rp-update-header__subtitle" *ngIf="regulatoryParam?.id">
        Une nouvelle version sera créée — la précédente est conservée dans l'historique.
      </p>
    </div>
  </div>

  <form [formGroup]="editForm" (ngSubmit)="save()" novalidate>

    <div class="rp-form-section">
      <div class="rp-form-section__header">
        <span class="rp-form-section__number">1</span>
        <span class="rp-form-section__title">Identification</span>
      </div>

      <div class="rp-form-grid">
        <div class="rp-form-field rp-form-field--full">
          <label class="rp-form-label" for="paramKey">Code technique <span class="rp-form-label__req">*</span></label>
          <input id="paramKey" class="rp-form-input rp-form-input--code" type="text" formControlName="paramKey" [readonly]="!!regulatoryParam?.id">
        </div>

        <div class="rp-form-field rp-form-field--full">
          <label class="rp-form-label" for="paramLabel">Libellé descriptif <span class="rp-form-label__req">*</span></label>
          <input id="paramLabel" class="rp-form-input" type="text" formControlName="paramLabel">
        </div>
      </div>
    </div>

    <div class="rp-form-section">
      <div class="rp-form-section__header">
        <span class="rp-form-section__number">2</span>
        <span class="rp-form-section__title">Application & Valeur</span>
      </div>

      <div class="rp-form-grid">
        <div class="rp-form-field">
          <label class="rp-form-label" for="numericValue">Valeur numérique <span class="rp-form-label__req">*</span></label>
          <div class="rp-input-group">
            <input id="numericValue" class="rp-form-input rp-form-input--no-border" type="number" step="0.0001" formControlName="numericValue">
            <span class="rp-input-group__unit">—</span>
          </div>
        </div>

        <div class="rp-form-field">
          <label class="rp-form-label" for="effectiveFrom">Date d'effet <span class="rp-form-label__req">*</span></label>
          <input id="effectiveFrom" class="rp-form-input" type="date" formControlName="effectiveFrom">
        </div>

        <div class="rp-form-field rp-form-field--full">
          <label class="rp-form-label" for="legalReference">Référence légale</label>
          <input id="legalReference" class="rp-form-input" type="text" formControlName="legalReference">
        </div>
      </div>
    </div>

    <div class="rp-form-actions">
      <button type="button" class="btn-ghost" (click)="previousState()">Annuler</button>
      <button type="submit" class="btn-primary" [disabled]="isSaving || editForm.invalid">
        {{ regulatoryParam?.id ? 'Enregistrer la version' : 'Créer le paramètre' }}
      </button>
    </div>

  </form>
</div>

<style>
  :host {
    --primary: #1d4ed8; --gray-50: #f8fafc; --gray-200: #e2e8f0; --radius: 10px;
  }
  .rp-update-page { padding: 28px 32px; max-width: 720px; margin: 0 auto; font-family: 'Segoe UI', system-ui, sans-serif; }
  .rp-update-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 28px; }
  .rp-update-header__title { font-size: 20px; font-weight: 700; margin: 0; }
  .rp-form-section { background: var(--gray-50); border: 1.5px solid var(--gray-200); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .rp-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .rp-form-field--full { grid-column: span 2; }
  .rp-form-label { font-size: 13px; font-weight: 600; margin-bottom: 5px; display: block; }
  .rp-form-input { width: 100%; padding: 10px; border: 1.5px solid var(--gray-200); border-radius: var(--radius); outline: none; }
  .rp-form-input--code { font-family: monospace; text-transform: uppercase; }
  .rp-input-group { display: flex; align-items: center; border: 1.5px solid var(--gray-200); border-radius: var(--radius); background: white; }
  .rp-input-group__unit { padding: 10px; background: var(--gray-100); border-left: 1.5px solid var(--gray-200); font-size: 13px; font-weight: 600; }
  .rp-form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .btn-primary { background: var(--primary); color: white; padding: 10px 22px; border: none; border-radius: var(--radius); font-weight: 600; }
  .btn-ghost { background: transparent; border: 1.5px solid var(--gray-200); padding: 10px 22px; border-radius: var(--radius); }
</style>
