@if (leaveRequest) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(leaveRequest.id!)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="leaveRequestDeleteDialogHeading" pzTranslate="entity.delete.title">Confirmation de suppression</h4>
    </div>

    <div class="modal-body">
      <pz-alert-error />
      <p
        id="pz-delete-leaveRequest-heading"
        pzTranslate="paieZoneRhApp.leaveRequest.delete.question"
        [translateValues]="{ id: leaveRequest.id }"
      >
        Êtes-vous certain de vouloir supprimer le Leave Request {{ leaveRequest.id }} ?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
        <fa-icon icon="ban"></fa-icon>&nbsp;<span pzTranslate="entity.action.cancel">Annuler</span>
      </button>

      <button id="pz-confirm-delete-leaveRequest" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times"></fa-icon>&nbsp;<span pzTranslate="entity.action.delete">Supprimer</span>
      </button>
    </div>
  </form>
}
