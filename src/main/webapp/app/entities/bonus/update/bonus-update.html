<!-- src/main/webapp/app/entities/bonus/update/bonus-update.component.html -->
<div class="row justify-content-center">
  <div class="col-md-6">
    <form novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2>{{ bonus?.id ? 'Modifier' : 'Nouvelle' }} Prime</h2>
      <pz-alert-error></pz-alert-error>
      <div class="mb-3">
        <label class="form-label">Employé ID <span class="text-danger">*</span></label>
        <input type="number" class="form-control" formControlName="employeeId"/>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Type de prime</label>
          <select class="form-select" formControlName="bonusType">
            <option *ngFor="let t of bonusTypes" [value]="t">{{ t }}</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Libellé <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="label"/>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Montant (DT) <span class="text-danger">*</span></label>
          <input type="number" step="0.001" class="form-control text-end" formControlName="amount"/>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Mois <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="month">
            <option *ngFor="let m of months" [value]="m">{{ monthLabels[m] }}</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Année <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="year">
            <option *ngFor="let y of years" [value]="y">{{ y }}</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="taxable" formControlName="taxable"/>
          <label class="form-check-label" for="taxable">Imposable (soumis à l'IRPP)</label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea class="form-control" formControlName="notes" rows="2"></textarea>
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon> Annuler
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid || isSaving">
          <fa-icon icon="save"></fa-icon> Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>
