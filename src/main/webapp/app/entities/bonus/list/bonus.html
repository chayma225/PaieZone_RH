<!-- src/main/webapp/app/entities/bonus/list/bonus.component.html -->
<div>
  <h2>
    Primes
    <div class="d-flex justify-content-end gap-2">
      <button class="btn btn-info btn-sm" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync"></fa-icon>
      </button>
      <a class="btn btn-primary btn-sm" [routerLink]="['./new']">
        <fa-icon icon="plus"></fa-icon> Nouvelle prime
      </a>
    </div>
  </h2>
  <pz-alert-error></pz-alert-error>
  <div class="row mb-2">
    <div class="col-md-3">
      <input type="number" class="form-control form-control-sm" placeholder="Filtrer par Employé ID"
             [(ngModel)]="filterEmployeeId" (change)="load()"/>
    </div>
  </div>

  <div class="table-responsive" *ngIf="bonuses?.length; else noResult">
    <table class="table table-striped table-sm">
      <thead>
      <tr>
        <th>Employé</th><th>Type</th><th>Libellé</th>
        <th class="text-end">Montant</th><th>Période</th><th>Imposable</th><th></th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let b of bonuses; trackBy: trackId">
        <td>{{ b.employeeId }}</td>
        <td><span class="badge bg-primary">{{ b.bonusType }}</span></td>
        <td>{{ b.label }}</td>
        <td class="text-end fw-bold">{{ b.amount | number:'1.3-3' }} DT</td>
        <td>{{ months[b.month!] }} {{ b.year }}</td>
        <td>
            <span class="badge" [ngClass]="b.taxable ? 'bg-warning text-dark' : 'bg-secondary'">
              {{ b.taxable ? 'Oui' : 'Non' }}
            </span>
        </td>
        <td>
          <div class="btn-group btn-group-sm">
            <a [routerLink]="['./', b.id, 'edit']" class="btn btn-primary"><fa-icon icon="pencil-alt"></fa-icon></a>
            <button class="btn btn-danger" (click)="delete(b)"><fa-icon icon="times"></fa-icon></button>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <ng-template #noResult>
    <div class="alert alert-info" *ngIf="!isLoading">Aucune prime trouvée.</div>
  </ng-template>
</div>
