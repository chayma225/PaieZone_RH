<form (ngSubmit)="confirmDelete(bonus!.id)">
  <div class="modal-header"><h4>Supprimer la prime</h4><button type="button" class="btn-close" (click)="cancel()"></button></div>
  <div class="modal-body">Supprimer la prime <strong>{{ bonus?.label }}</strong> ({{ bonus?.amount | number:'1.3-3' }} DT) ?</div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
    <button type="submit" class="btn btn-danger">Supprimer</button>
  </div>
</form>
