@if (leaveType) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(leaveType.id!)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="leaveTypeDeleteDialogHeading" pzTranslate="entity.delete.title">Confirmation de suppression</h4>
    </div>

    <div class="modal-body">
      <pz-alert-error />
      <p id="pz-delete-leaveType-heading" pzTranslate="paieZoneRhApp.leaveType.delete.question" [translateValues]="{ id: leaveType.id }">
        Êtes-vous certain de vouloir supprimer le Leave Type {{ leaveType.id }} ?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span pzTranslate="entity.action.cancel">Annuler</span>
      </button>

      <button id="pz-confirm-delete-leaveType" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span pzTranslate="entity.action.delete">Supprimer</span>
      </button>
    </div>
  </form>
}
